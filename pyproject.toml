[project]
name = "agent-backlog-runner"
version = "0.2.0"
description = "Local SQLite backlog runner for bounded agent task queues"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "matchalatteguy" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["agents", "sqlite", "backlog", "scheduler", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/matchalatteguy/agent-backlog-runner"
Issues = "https://github.com/matchalatteguy/agent-backlog-runner/issues"

[project.scripts]
agent-backlog = "agent_backlog_runner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
